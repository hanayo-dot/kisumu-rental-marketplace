services:
  # Backend API Web Service
  - type: web
    name: kisumu-rental-backend
    env: go
    buildCommand: cd backend && go build -o main cmd/main.go
    startCommand: ./backend/main
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kisumu-rental-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://kisumu-rental-frontend.onrender.com

  # Frontend Static Site
  - type: web
    name: kisumu-rental-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://kisumu-rental-backend.onrender.com/api

databases:
  # Managed PostgreSQL Database
  - name: kisumu-rental-db
    databaseName: kisumu_rental
    user: kisumu_user
